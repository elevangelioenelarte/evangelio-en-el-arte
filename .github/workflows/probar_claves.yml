name: Probar claves

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gemini:
    name: Probar la clave de Gemini
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar la clave y listar modelos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/probar_gemini.py
