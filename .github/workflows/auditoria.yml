name: Auditoría de vocabulario

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  auditoria:
    name: Auditar el vocabulario de la Biblia
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar la Biblia
        run: python scripts/comprobar_biblia.py descarga
      - name: Generar los informes
        run: |
          python scripts/auditar_vocabulario.py descarga/biblia.json informe_vocabulario.md
          python scripts/informe_adaptacion.py descarga/biblia.json informe_adaptacion.md
      - name: Publicar los informes en incidencias
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          publicar() {
            titulo="$1"; archivo="$2"
            numero=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100" \
              --jq ".[] | select(.title == \"$titulo\") | .number" | head -n 1)
            if [ -n "$numero" ]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$numero" -F body=@"$archivo" --silent
            else
              gh api -X POST "repos/$GITHUB_REPOSITORY/issues" -f title="$titulo" -F body=@"$archivo" --silent
            fi
          }
          publicar "Informe: auditoría de vocabulario" informe_vocabulario.md
          publicar "Informe: adaptación católica" informe_adaptacion.md
